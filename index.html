<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de ingreso · Territorio Ancestral Puracé</title>
<style>
:root{--azul:#1e4a7a;--azul-osc:#163a61;--verde:#7fbc4d;--naranja:#ea8a33;--cielo:#3bb4e5;--beige:#f6f1e8;--texto:#1a2e3a;--muted:#5a6d7e;--linea:#e3dccd;--error:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--beige);color:var(--texto);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,var(--azul),var(--cielo));color:#fff;padding:14px 16px 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
header .org{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.92;padding-top:6px}
header h1{margin:10px 0 0;font-size:21px;line-height:1.25}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.18);border-radius:10px;padding:3px}
.langs button{border:0;background:transparent;color:#fff;font-weight:700;font-size:13px;padding:6px 9px;border-radius:7px;cursor:pointer;letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:#fff;color:var(--azul)}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px;color:var(--azul)}
h3{font-size:15px;margin:0;color:var(--azul)}
p{margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;font-weight:400;padding:11px 12px;border:1.5px solid #cfc6b4;border-radius:10px;background:#fff;color:var(--texto);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(59,180,229,.35);border-color:var(--cielo)}
.invalid{border-color:var(--error)!important;background:#fff6f5!important}
button{font:inherit;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:12px;border:1.5px solid var(--azul);background:var(--azul);color:#fff;font-weight:700;font-size:16px;margin:0 0 10px;text-decoration:none}
.btn:hover{background:var(--azul-osc)}
.btn:disabled{opacity:.6}
.btn.sec{background:#fff;color:var(--azul)}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.wa:hover{background:#1ebe5a}
.link{background:none;border:0;color:var(--azul);font-weight:700;padding:6px 0;font-size:14px;text-decoration:underline}
.link.danger{color:var(--error)}
.hidden{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1.5px solid var(--azul);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:11px;border-radius:9px;font-weight:700;color:var(--azul);font-size:16px}
.seg button[aria-pressed="true"]{background:var(--azul);color:#fff}
.legal{font-size:14px;line-height:1.55;background:var(--beige);border-radius:12px;padding:14px;max-height:300px;overflow:auto}
.legal p{margin:0 0 9px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px;margin-top:12px}
.check input{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto}
.pad{display:block;width:100%;height:150px;background:#fff;border:1.5px dashed #b9b09c;border-radius:10px;touch-action:none}
.firma-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;font-size:14px;font-weight:600}
.persona-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.msg{display:none;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.msg.err{display:block;background:#fdecea;color:#7a1b15;border:1px solid #f1b8b2}
.msg.ok{display:block;background:#edf7e3;color:#2f5a12;border:1px solid #c5e3a4}
.msg.info{display:block;background:#e8f5fc;color:#124a68;border:1px solid #b5e0f5}
.folio{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:700;color:var(--azul);letter-spacing:.04em}
.dato{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.valor{font-size:15px;margin-bottom:10px}
table.tabla{width:100%;border-collapse:collapse;font-size:14px}
table.tabla th,table.tabla td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linea);vertical-align:top}
table.tabla th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qrbox canvas{width:220px;height:220px;max-width:72vw;max-height:72vw;image-rendering:pixelated;border:1px solid var(--linea);border-radius:8px;background:#fff}
.code{font-family:ui-monospace,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.1em;color:var(--azul)}
.aviso{font-size:13px;color:#7a4a00;background:#fff4e5;border:1px solid #f5d3a1;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.nota{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 24px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="org" id="org"></div>
    <div class="langs" role="group" aria-label="Language / Idioma / Langue / Idioma / Sprache">
      <button type="button" class="lang-btn" data-lang="es" aria-label="Español" aria-pressed="true">ES</button>
      <button type="button" class="lang-btn" data-lang="en" aria-label="English" aria-pressed="false">EN</button>
      <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" aria-pressed="false">FR</button>
      <button type="button" class="lang-btn" data-lang="pt" aria-label="Português" aria-pressed="false">PT</button>
      <button type="button" class="lang-btn" data-lang="de" aria-label="Deutsch" aria-pressed="false">DE</button>
    </div>
  </div>
  <h1 id="titulo" data-i18n="title.reg">Registro de ingreso al Territorio Ancestral</h1>
</header>

<main>
  <div id="avisoModo" class="aviso hidden" data-i18n="sent.modoPrueba">Modo de prueba: el registro se guarda solo en este navegador.</div>

  <!-- ============ FORMULARIO ============ -->
  <section id="vistaRegistro">
    <div class="seg" role="group">
      <button type="button" id="btnIndividual" aria-pressed="true" data-i18n="seg.ind">Individual</button>
      <button type="button" id="btnGrupo" aria-pressed="false" data-i18n="seg.grp">Grupo</button>
    </div>

    <div class="card">
      <h2 data-i18n="sec.datos">Datos del ingreso</h2>
      <div class="grid">
        <label><span data-i18n="f.fecha">Fecha de ingreso *</span><input type="date" id="fechaIngreso"></label>
        <label><span data-i18n="f.actividad">Actividad o sitio a visitar</span><input id="actividad" maxlength="160" data-i18n-ph="f.actividadPh" placeholder="Ej.: Termales de San Juan"></label>
      </div>
    </div>

    <div id="liderBox" class="card hidden">
      <h2 data-i18n="sec.lider">Persona responsable del grupo</h2>
      <div class="grid">
        <label><span data-i18n="f.liderNombre">Nombre *</span><input id="liderNombre" maxlength="120" autocomplete="off"></label>
        <label><span data-i18n="f.liderTel">Teléfono *</span><input id="liderTelefono" type="tel" inputmode="tel" maxlength="20" autocomplete="off"></label>
      </div>
    </div>

    <div id="listaPersonas"></div>
    <button type="button" id="btnAgregar" class="btn sec hidden" data-i18n="btn.agregar">+ Agregar integrante</button>

    <div class="card">
      <h2 data-i18n="sec.acta">Acta de corresponsabilidad</h2>
      <div class="legal">
        <p data-i18n="leg1"></p>
        <p data-i18n="leg2"></p>
        <p data-i18n="leg3"></p>
        <p data-i18n="leg4"></p>
        <p data-i18n="leg5"></p>
        <p data-i18n="leg6"></p>
      </div>
      <label class="check"><input type="checkbox" id="acepto"><span data-i18n="acepto">Leí y acepto el acta. Cada persona registrada firma en su propio recuadro.</span></label>
      <label class="check"><input type="checkbox" id="consent"><span data-i18n="consent">Autorizo al Cabildo Indígena de Puracé a tratar mis datos personales y de salud.</span></label>
    </div>

    <div id="msg" class="msg" role="alert"></div>
    <button type="button" id="btnGenerar" class="btn" data-i18n="btn.enviar">Enviar registro</button>
  </section>

  <!-- ============ ACUSE DE RECIBO ============ -->
  <section id="vistaEnviado" class="hidden">
    <div id="msgEnv" class="msg" role="status"></div>
    <div class="card">
      <div class="dato" data-i18n="sent.titulo">Registro enviado</div>
      <div class="folio" id="sFolio"></div>
      <div class="valor nota" id="sFechas"></div>
      <div class="grid">
        <div><div class="dato" data-i18n="sent.estado">Estado</div><div class="valor" data-i18n="sent.recibido"></div></div>
      </div>
      <p id="sTexto"></p>
      <div id="sPersonas"></div>
    </div>
    <button type="button" id="btnCopia" class="btn sec" data-i18n="sent.copia">Descargar copia de mi registro (.json)</button>
    <button type="button" id="btnRespaldo" class="btn wa hidden" data-i18n="sent.respaldo">Enviar por WhatsApp como respaldo</button>
    <button type="button" id="btnNuevo" class="btn sec" data-i18n="sent.nuevo">Registrar otra persona</button>
  </section>

  <!-- ============ VERIFICACIÓN (se abre al escanear el QR de la constancia) ============ -->
  <section id="vistaVerificar" class="hidden">
    <div class="card">
      <div class="dato" data-i18n="v.folio">Folio</div>
      <div class="folio" id="verFolio"></div>
      <div class="valor"></div>
      <div class="grid">
        <div><div class="dato" data-i18n="v.fecha">Fecha de registro</div><div class="valor" id="verFecha"></div></div>
        <div><div class="dato" data-i18n="v.codigo">Código de verificación</div><div class="valor code" id="verCodigo"></div></div>
      </div>
      <p data-i18n="v.p1"></p>
      <div class="valor" id="verDatos" style="margin:10px 0"></div>
      <p data-i18n="v.p2"></p>
    </div>
    <a class="btn sec" id="verNuevo" href="#" data-i18n="v.btn">Registrar una persona</a>
  </section>
</main>

<footer id="pie"></footer>

<script>

// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(clave, vars){
  let s = (T[lang] && T[lang][clave]) ?? T.es[clave] ?? clave;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function canon(v){            // JSON con claves ordenadas: misma huella en cualquier navegador
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
async function sha256Hex(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
// Solo estos campos entran en la huella. El idioma no cambia el código de verificación.
const hashable = r => ({ folio: r.folio, creado: r.creado, tipo: r.tipo, fechaIngreso: r.fechaIngreso, actividad: r.actividad, lider: r.lider, personas: r.personas });

function generarFolio(d){
  const yy = String(d.getFullYear()).slice(2), mm = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  const alfa = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const r = new Uint32Array(4); crypto.getRandomValues(r);
  let s = ''; for (const n of r) s += alfa[n % alfa.length];
  return `PC-${yy}${mm}${dd}-${s}`;
}
const formatCodigo = c => c.match(/.{1,4}/g).join(' ');
function fmtFechaIso(iso){
  if (!iso) return '—';
  return new Date(iso + 'T12:00:00').toLocaleDateString(LOCALES[lang], { day: '2-digit', month: 'short', year: 'numeric' });
}
const fmtFechaHora = iso => new Date(iso).toLocaleString(LOCALES[lang], { dateStyle: 'medium', timeStyle: 'short' });
const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const telValido = t => { const s = (t || '').trim(); const d = s.replace(/\D/g, ''); return d.length >= 7 && d.length <= 15 && /^[0-9+()\s-]+$/.test(s); };

function urlVerificacion(folio, codigo){
  const base = CONFIG.urlBase || location.href.split(/[?#]/)[0];
  return `${base.split('#')[0]}#v=${folio}.${codigo}`;
}
/* Texto del QR de la constancia: se lee sin internet. Solo ASCII, sin tildes ni símbolos,
   para que cualquier lector de QR lo muestre igual. No incluye el estado (cambia con el tiempo);
   el enlace de la última línea sirve para consultarlo en línea. */
const sinTildes = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const inicialesNombre = s => sinTildes(s).trim().split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + '.').join(' ');
function textoQR(rec, url){
  const p = rec.personas || [];
  const fechaIng = String(rec.fechaIngreso || '').split('-').reverse().join('/');
  const lineas = [
    'CABILDO INDIGENA DE PURACE',
    'CONSTANCIA DE REGISTRO DE INGRESO',
    `Folio: ${rec.folio}`,
    `Codigo: ${rec.codigo}`,
    `Fecha de ingreso: ${fechaIng}`,
  ];
  if (rec.tipo === 'grupo'){
    lineas.push(`Grupo: ${p.length} persona(s)`);
    lineas.push(`Responsable: ${inicialesNombre(rec.lider?.nombre)}`);
  } else {
    const d = p[0] || {};
    const num = String(d.docNumero ?? '');
    lineas.push(`Titular: ${inicialesNombre(d.nombre)}`);
    lineas.push(`Documento: ${sinTildes(d.docTipo)} ${'*'.repeat(Math.max(num.length - 4, 0))}${num.slice(-4)}`);
  }
  lineas.push(`Verificacion en linea: ${url}`);
  return lineas.join('\n');
}
function mostrarMsg(id, tipoMsg, texto){ const el = $(id); el.className = 'msg ' + tipoMsg; el.textContent = texto; }
function ocultarMsg(id){ const el = $(id); el.className = 'msg'; el.textContent = ''; }
function descargar(blob, nombre){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

/* ---------- QR (qrcode-generator, MIT, incluida abajo) ---------- */
function matrizQR(texto){
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  const n = q.getModuleCount(), m = [];
  for (let r = 0; r < n; r++){ const fila = []; for (let c = 0; c < n; c++) fila.push(q.isDark(r, c)); m.push(fila); }
  return m;
}
function dibujarQR(ctx, texto, x, y, tam){
  const m = matrizQR(texto), n = m.length, zona = 2;
  const celda = Math.floor(tam / (n + zona * 2)), total = celda * (n + zona * 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, total, total);
  ctx.fillStyle = '#1a2e3a';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (m[r][c]) ctx.fillRect(x + (c + zona) * celda, y + (r + zona) * celda, celda, celda);
  return total;
}

function dibujarConstancia(rec, url){
  const W = 800, M = 40, AZUL = '#1e4a7a', VERDE = '#7fbc4d', MUTED = '#5a6d7e', TEXTO = '#1a2e3a';
  const FUENTE = '16px system-ui, Arial';
  const QR_TAM = 300;  // texto en QR: más módulos, necesita más tamaño para leerse bien
  const filaH = 36, encabH = 120, infoH = 150, tituloTabla = 80, encabTabla = 34, qrT = QR_TAM + 20, pieH = 110;
  const H = encabH + infoH + tituloTabla + encabTabla + rec.personas.length * filaH + 30 + qrT + pieH + 20;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const txt = (s, x, y, font, color, align = 'left') => { c.font = font; c.fillStyle = color; c.textAlign = align; c.fillText(s, x, y); c.textAlign = 'left'; };
  const fit = (s, maxW, font) => { c.font = font; s = String(s ?? ''); if (c.measureText(s).width <= maxW) return s; while (s.length > 1 && c.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; };
  const wrap = (s, maxW, font) => { c.font = font; const pal = String(s ?? '').split(/\s+/); const out = []; let cur = ''; for (const w of pal){ const tt = cur ? cur + ' ' + w : w; if (c.measureText(tt).width <= maxW) cur = tt; else { if (cur) out.push(cur); cur = w; } } if (cur) out.push(cur); return out; };
  const etiqueta = (s, x, y) => txt(s, x, y, '700 12px system-ui, Arial', MUTED);

  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

  // Encabezado
  const g = c.createLinearGradient(0, 0, W, encabH);
  g.addColorStop(0, AZUL); g.addColorStop(1, '#3bb4e5');
  c.fillStyle = g; c.fillRect(0, 0, W, encabH);
  txt(CONFIG.organizacion.toUpperCase() + ' · NIT ' + CONFIG.nit, M, 36, '600 14px system-ui, Arial', '#fff');
  txt(t('c.pdf.header'), M, 74, '800 30px system-ui, Arial', '#fff');
  txt(fit(CONFIG.territorio, W - 2 * M, FUENTE), M, 102, FUENTE, '#fff');

  // Datos del registro
  let y = encabH + 38;
  etiqueta(t('c.pdf.folio'), M, y);
  txt(rec.folio, M, y + 30, '700 26px ui-monospace, Consolas, monospace', AZUL);
  c.font = '700 12px system-ui, Arial'; c.textAlign = 'right'; c.fillStyle = MUTED; c.fillText(t('c.pdf.codigo'), W - M, y); c.textAlign = 'left';
  txt(formatCodigo(rec.codigo), W - M, y + 30, '700 22px ui-monospace, Consolas, monospace', AZUL, 'right');
  y += 66;
  const col2 = W / 2 + 10;
  etiqueta(t('c.pdf.fecha'), M, y);
  txt(fmtFechaIso(rec.fechaIngreso), M, y + 22, FUENTE, TEXTO);
  etiqueta(t('c.pdf.reg'), col2, y);
  txt(fmtFechaHora(rec.creado), col2, y + 22, FUENTE, TEXTO);
  y += 52;
  etiqueta(t('c.pdf.tipo'), M, y);
  txt(rec.tipo === 'grupo' ? t('c.tipoGrp', { n: rec.personas.length }) : t('c.tipoInd'), M, y + 22, FUENTE, TEXTO);
  etiqueta(t('c.pdf.act'), col2, y);
  txt(fit(rec.actividad || '—', W / 2 - M - 10, FUENTE), col2, y + 22, FUENTE, TEXTO);

  // Tabla de personas
  y = encabH + infoH + tituloTabla;
  txt(rec.tipo === 'grupo' ? t('c.integrantesReg') : t('c.personaReg'), M, y - 14, '700 15px system-ui, Arial', AZUL);
  c.fillStyle = AZUL; c.fillRect(M, y, W - 2 * M, encabTabla);
  const cols = { n: M + 10, nombre: M + 44, doc: M + 350, tel: M + 552 };
  const cab = '700 13px system-ui, Arial';
  txt(t('c.th.num'), cols.n, y + 22, cab, '#fff');
  txt(t('c.th.nombre'), cols.nombre, y + 22, cab, '#fff');
  txt(t('c.th.doc'), cols.doc, y + 22, cab, '#fff');
  txt(t('c.th.tel'), cols.tel, y + 22, cab, '#fff');
  y += encabTabla;
  rec.personas.forEach((p, i) => {
    if (i % 2 === 0) { c.fillStyle = '#f6f1e8'; c.fillRect(M, y, W - 2 * M, filaH); }
    c.strokeStyle = '#e3dccd'; c.beginPath(); c.moveTo(M, y + filaH); c.lineTo(W - M, y + filaH); c.stroke();
    txt(String(i + 1), cols.n, y + 23, '14px system-ui, Arial', TEXTO);
    txt(fit(p.nombre, 290, '15px system-ui, Arial'), cols.nombre, y + 23, '15px system-ui, Arial', TEXTO);
    txt(fit(`${p.docTipo} ${p.docNumero}`, 185, '14px system-ui, Arial'), cols.doc, y + 23, '14px system-ui, Arial', TEXTO);
    txt(fit(p.telefono, 130, '14px system-ui, Arial'), cols.tel, y + 23, '14px system-ui, Arial', TEXTO);
    y += filaH;
  });

  // Pie con QR de verificación
  y += 30;
  const qrX = W - M - QR_TAM;
  dibujarQR(c, textoQR(rec, url), qrX, y, QR_TAM);
  let ty = y + 22;
  [t('c.pdf.scan'), t('c.pdf.data')].forEach(l => {
    wrap(l, qrX - M - 20, '15px system-ui, Arial').forEach(linea => { txt(linea, M, ty, '15px system-ui, Arial', TEXTO); ty += 22; });
    ty += 8;
  });
  txt(t('c.pdf.code') + ' ' + formatCodigo(rec.codigo), M, ty + 6, '700 16px ui-monospace, Consolas, monospace', AZUL);

  // Banda inferior
  c.fillStyle = VERDE; c.fillRect(0, H - 12, W, 12);
  return cv;
}

/* ============================================================
   ALMACÉN COMPARTIDO: Supabase, o modo local de prueba
   Con CONFIG.supabaseUrl y CONFIG.supabaseKey vacíos, todo se guarda solo en este navegador.
   ============================================================ */
const LOCAL_KEY = 'registros-demo';
const COLS_LISTA = 'folio,creado,tipo,contacto,titular,personas_n,fecha_ingreso,estado,codigo,constancia_at,pago_verificado,condiciones_verificadas,notas';
function leerLocal(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); } catch (e) { return {}; } }
function guardarLocal(m){ localStorage.setItem(LOCAL_KEY, JSON.stringify(m)); }

const DB = {
  cliente: null,
  modo(){ return (CONFIG.supabaseUrl && CONFIG.supabaseKey) ? 'supabase' : 'local'; },
  iniciar(){
    if (this.modo() === 'supabase' && window.supabase)
      this.cliente = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    return this;
  },
  async insertar(fila){
    if (this.cliente){
      const { error } = await this.cliente.from('registros').insert(fila);
      if (error) throw new Error(error.message);
      return;
    }
    const m = leerLocal();
    if (m[fila.folio]) throw new Error('folio repetido');
    m[fila.folio] = fila; guardarLocal(m);
  },
  async upsert(fila){
    if (this.cliente){
      const { error } = await this.cliente.from('registros').upsert(fila, { onConflict: 'folio' });
      if (error) throw new Error(error.message);
      return;
    }
    const m = leerLocal(); m[fila.folio] = { ...(m[fila.folio] || {}), ...fila }; guardarLocal(m);
  },
  async listar(){
    if (this.cliente){
      const { data, error } = await this.cliente.from('registros').select(COLS_LISTA).order('creado', { ascending: false });
      if (error) throw new Error(error.message);
      return data;
    }
    return Object.values(leerLocal()).map(({ datos, ...r }) => r).sort((a, b) => (b.creado || '').localeCompare(a.creado || ''));
  },
  async todos(){
    if (this.cliente){
      const { data, error } = await this.cliente.from('registros').select('*');
      if (error) throw new Error(error.message);
      return data;
    }
    return Object.values(leerLocal());
  },
  async leerDatos(folio){
    if (this.cliente){
      const { data, error } = await this.cliente.from('registros').select('datos').eq('folio', folio).maybeSingle();
      if (error) throw new Error(error.message);
      return data ? data.datos : null;
    }
    const r = leerLocal()[folio]; return r ? r.datos : null;
  },
  async actualizar(folio, cambios){
    if (this.cliente){
      const { error } = await this.cliente.from('registros').update(cambios).eq('folio', folio);
      if (error) throw new Error(error.message);
      return;
    }
    const m = leerLocal(); if (!m[folio]) throw new Error('no existe');
    m[folio] = { ...m[folio], ...cambios }; guardarLocal(m);
  },
  async haySesion(){
    if (!this.cliente) return true;
    const { data } = await this.cliente.auth.getSession();
    return !!(data && data.session);
  },
  async entrar(correo, clave){
    const { error } = await this.cliente.auth.signInWithPassword({ email: correo, password: clave });
    if (error) throw new Error(error.message);
  },
  async salir(){ if (this.cliente) await this.cliente.auth.signOut(); }
};

function numeroWhatsapp(tel){
  let d = String(tel || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 10 && d.startsWith('3')) d = '57' + d;   // celular colombiano
  return d;
}
function filaDesdeCore(core, codigo, estado){
  const titular = core.tipo === 'grupo' ? (core.lider?.nombre || '') : (core.personas[0]?.nombre || '');
  const contacto = core.tipo === 'grupo' ? (core.lider?.telefono || '') : (core.personas[0]?.telefono || '');
  return {
    folio: core.folio, creado: core.creado, tipo: core.tipo, contacto, titular,
    personas_n: core.personas.length, fecha_ingreso: core.fechaIngreso,
    estado, codigo: codigo || null, datos: core
  };
}
async function codigoDe(core){
  return (await sha256Hex(canon(hashable(core)))).slice(0, 12).toUpperCase();
}
// Dibuja la constancia en el idioma del visitante (no cambia el idioma de la pantalla)
async function constanciaPNG(rec, idioma){
  const previo = lang;
  lang = idioma || rec.idioma || 'es';
  try {
    const cv = dibujarConstancia(rec, urlVerificacion(rec.folio, rec.codigo));
    return await new Promise(r => cv.toBlob(r, 'image/png'));
  } finally { lang = previo; }
}

/* ---------- Firma (canvas) ---------- */
function FirmaPad(cv){
  const ctx = cv.getContext('2d');
  let dibujando = false, ultimoPunto = null, sucio = false;
  cv.width = 600; cv.height = 220;
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a2e3a';
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  cv.addEventListener('pointerdown', e => { dibujando = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} ultimoPunto = pos(e); e.preventDefault(); });
  cv.addEventListener('pointermove', e => {
    if (!dibujando || !ultimoPunto) return;
    const p = pos(e); ctx.beginPath(); ctx.moveTo(ultimoPunto.x, ultimoPunto.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimoPunto = p; sucio = true; e.preventDefault();
  });
  const fin = () => { dibujando = false; };
  cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
  return {
    limpiar(){ ctx.clearRect(0, 0, cv.width, cv.height); sucio = false; },
    vacia(){ return !sucio; },
    png(){ return cv.toDataURL('image/png'); }
  };
}

function personaHTML(){

      <label><span data-i18n="f.docNumero">Número de documento *</span><input data-f="docNumero" inputmode="numeric" maxlength="20" autocomplete="off"></label>
      <label><span data-i18n="f.edad">Edad *</span><input data-f="edad" type="number" inputmode="numeric" min="0" max="120"></label>
      <label><span data-i18n="f.telefono">Teléfono de contacto *</span><input data-f="telefono" type="tel" inputmode="tel" maxlength="20" autocomplete="off"></label>

}

function agregarPersona(){
  const id = nextId++;
  const card = document.createElement('div');
  card.className = 'card persona'; card.dataset.id = id;
  card.innerHTML = personaHTML();
  $('#listaPersonas').appendChild(card);
  pads.set(id, FirmaPad(card.querySelector('canvas')));
  card.querySelector('[data-act="limpiar"]').onclick = () => pads.get(id).limpiar();
  card.querySelector('[data-act="quitar"]').onclick = () => quitarPersona(card);
  aplicarIdioma(card);
  renumerar();
  return card;
}
function quitarPersona(card){ pads.delete(Number(card.dataset.id)); card.remove(); renumerar(); }
function renumerar(){
  const cards = $$('.persona', $('#listaPersonas'));
  cards.forEach((c, i) => {
    c.querySelector('.titulo-persona').textContent = tipo === 'grupo' ? t('p.integrante', { n: i + 1 }) : t('p.titulo');
    c.querySelector('[data-act="quitar"]').classList.toggle('hidden', tipo !== 'grupo' || cards.length <= 1);
  });
}

  tipo = nuevo;
  $('#btnIndividual').setAttribute('aria-pressed', nuevo === 'individual');
  $('#btnGrupo').setAttribute('aria-pressed', nuevo === 'grupo');
  $('#liderBox').classList.toggle('hidden', nuevo !== 'grupo');
  $('#btnAgregar').classList.toggle('hidden', nuevo !== 'grupo');
  const cards = $$('.persona', $('#listaPersonas'));
  if (nuevo === 'individual') cards.slice(1).forEach(quitarPersona);
  if ($$('.persona', $('#listaPersonas')).length === 0) agregarPersona();
  renumerar();
}

function leerPersona(card){
  const g = f => card.querySelector(`[data-f="${f}"]`).value.trim();
  const pad = pads.get(Number(card.dataset.id));
  return {
    nombre: g('nombre'), docTipo: g('docTipo'), docNumero: g('docNumero'), edad: g('edad'),
    telefono: g('telefono'), residencia: g('residencia'), emNombre: g('emNombre'), emTelefono: g('emTelefono'),
    salud: g('salud'), firma: pad.png(), firmaVacia: pad.vacia()
  };
}

function validar(){
  const errs = [];
  $$('.invalid').forEach(e => e.classList.remove('invalid'));
  const marcar = (el, texto) => { if (el) el.classList.add('invalid'); errs.push({ el, texto }); };
  if (!$('#fechaIngreso').value) marcar($('#fechaIngreso'), t('err.fecha'));
  if (tipo === 'grupo'){
    if (!$('#liderNombre').value.trim()) marcar($('#liderNombre'), t('err.liderNombre'));
    if (!telValido($('#liderTelefono').value)) marcar($('#liderTelefono'), t('err.liderTel'));
  }
  $$('.persona').forEach((card, i) => {
    const p = leerPersona(card);
    const pre = tipo === 'grupo' ? t('err.member', { n: i + 1 }) : '';
    const campo = (f, ok, clave) => { if (!ok) marcar(card.querySelector(`[data-f="${f}"]`), pre + t(clave)); };
    campo('nombre', p.nombre.length >= 3, 'err.nombre');
    campo('docNumero', /^[0-9A-Za-z.\- ]{4,20}$/.test(p.docNumero), 'err.docNumero');
    campo('edad', /^\d{1,3}$/.test(p.edad) && Number(p.edad) <= 120, 'err.edad');
    campo('telefono', telValido(p.telefono), 'err.telefono');
    campo('emNombre', p.emNombre.length >= 3, 'err.emNombre');
    campo('emTelefono', telValido(p.emTelefono), 'err.emTelefono');
    if (p.firmaVacia) marcar(card.querySelector('canvas'), pre + t('err.firma'));
  });
  if (!$('#acepto').checked) marcar($('#acepto'), t('err.acepto'));
  return errs;
}



async function enviar(){
  ocultarMsg('#msg'); ocultarMsg('#msgEnv');
  $('#btnRespaldo').classList.add('hidden');
  const errs = validar();
  const consent = $('#consent');
  if (!consent.checked){ consent.classList.add('invalid'); errs.push({ el: consent, texto: t('err.consent') }); }
  if (errs.length){
    mostrarMsg('#msg', 'err', t('err.prefix') + errs.slice(0, 4).map(e => e.texto).join(' · ') + (errs.length > 4 ? ' …' : ''));
    const primero = errs[0].el; if (primero) primero.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const btn = $('#btnGenerar'); btn.disabled = true; btn.textContent = t('msg.generando');
  try {
    const creado = new Date();
    const core = {
      folio: generarFolio(creado), creado: creado.toISOString(), tipo,
      fechaIngreso: $('#fechaIngreso').value,
      actividad: $('#actividad').value.trim(),
      lider: tipo === 'grupo' ? { nombre: $('#liderNombre').value.trim(), telefono: $('#liderTelefono').value.trim() } : null,
      personas: $$('.persona').map(c => { const p = leerPersona(c); delete p.firmaVacia; return p; }),
      idioma: lang
    };

    mostrarMsg('#msg', 'err', t('sent.error', { e: e.message }));
    $('#btnRespaldo').classList.remove('hidden');

    btn.disabled = false; btn.textContent = t('btn.enviar');
  }
}

function mostrarEnviado(){

  $('#titulo').textContent = t('sent.titulo');
  $('#sFolio').textContent = core.folio;
  $('#sFechas').textContent = `${t('c.registrado')}: ${fmtFechaHora(core.creado)} · ${t('c.fechaIngreso')}: ${fmtFechaIso(core.fechaIngreso)}`;
  $('#sTexto').textContent = t('sent.texto', { tel: fila.contacto || '—' });
  $('#sPersonas').innerHTML = `<table class="tabla"><thead><tr><th>#</th><th>${esc(t('c.th.nombre'))}</th><th>${esc(t('c.th.doc'))}</th></tr></thead><tbody>${
    core.personas.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.nombre)}</td><td>${esc(p.docTipo)} ${esc(p.docNumero)}</td></tr>`).join('')
  }</tbody></table>`;
  $('#avisoModo').classList.toggle('hidden', DB.modo() !== 'local');
  window.scrollTo(0, 0);
}

function descargarCopia(){
  const { core } = ultimo;
  const copia = { formato: 'registro-ingreso-purace', version: 2, organizacion: CONFIG.organizacion, nit: CONFIG.nit, ...core, codigo: null };
  descargar(new Blob([JSON.stringify(copia, null, 2)], { type: 'application/json' }), `${core.folio}.json`);
}

function respaldo(){
  const { core } = ultimo;
  descargarCopia();
  const texto = t('share.text', { folio: core.folio });
  if (CONFIG.whatsapp) window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`, '_blank');
  mostrarMsg('#msgEnv', 'info', t('share.dl'));
}

/* ============================================================
   VERIFICACIÓN (página abierta desde el QR de la constancia: …#v=FOLIO.CODIGO)
   ============================================================ */
function mostrarVerificacion(parametro){
  vista = 'verif'; parametroVerif = parametro;
  $('#vistaRegistro').classList.add('hidden');
  $('#vistaEnviado').classList.add('hidden');
  $('#vistaVerificar').classList.remove('hidden');
  $('#titulo').textContent = t('title.verif');
  const cont = $('#vistaVerificar');
  const m = /^(PC-(\d{2})(\d{2})(\d{2})-[A-Z2-9]{4})\.([0-9A-F]{12})$/i.exec(parametro);
  let aviso = cont.querySelector('.msg.err');
  if (!m){
    cont.querySelectorAll('.card, a.btn').forEach(e => e.classList.add('hidden'));
    if (!aviso){ aviso = document.createElement('div'); aviso.className = 'msg err'; cont.prepend(aviso); }
    aviso.style.display = 'block'; aviso.textContent = t('v.invalid');
    return;
  }
  cont.querySelectorAll('.card, a.btn').forEach(e => e.classList.remove('hidden'));
  if (aviso) aviso.remove();
  $('#verFolio').textContent = m[1];
  $('#verFecha').textContent = fmtFechaIso(`20${m[2]}-${m[3]}-${m[4]}`);
  $('#verCodigo').textContent = formatCodigo(m[5].toUpperCase());
  $('#verNuevo').href = location.href.split(/[?#]/)[0];
  verificarEnBase(m[1].toUpperCase(), m[5].toUpperCase());
}

/* Consulta el nombre enmascarado solo si el folio y el código coinciden (función de la base) */
async function verificarEnBase(folio, codigo){
  const dv = $('#verDatos');
  dv.textContent = '';
  if (!DB.cliente){ dv.textContent = t('v.sinBase'); return; }
  try {
    const { data, error } = await DB.cliente.rpc('verificar_constancia', { p_folio: folio, p_codigo: codigo });
    if (error) throw new Error(error.message);
    if (!data || !data.length){
      dv.innerHTML = `<div class="msg err" style="display:block">${esc(t('v.nocoincide'))}</div>`;
      return;
    }
    const r = data[0];
    const lineas = [];
    if (r.tipo === 'grupo'){
      lineas.push(`${esc(t('v.grupo', { n: r.personas_n }))}: <b>${esc(r.titular_mask || '')}</b>`);
    } else {
      lineas.push(`${esc(t('v.titular'))}: <b>${esc(r.titular_mask || '')}</b>`);
      lineas.push(`${esc(t('v.documento'))}: <b>${esc(t('doc.' + r.doc_tipo))} ${esc(r.documento_mask || '')}</b>`);
    }
    lineas.push(`${esc(t('v.estado'))}: <b>${esc(t('v.est.' + r.estado))}</b>`);
    dv.innerHTML = lineas.map(l => `<div style="margin:4px 0">${l}</div>`).join('');
  } catch (e) {
    dv.textContent = t('v.sinBase');
  }
}

/* ============================================================
   IDIOMA
   ============================================================ */
function idiomaInicial(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q && IDIOMAS.includes(q)) return q;
  try { const s = localStorage.getItem('idioma'); if (s && IDIOMAS.includes(s)) return s; } catch (e) {}
  const n = (navigator.language || 'es').slice(0, 2).toLowerCase();
  return IDIOMAS.includes(n) ? n : 'es';
}
function aplicarIdioma(raiz = document){
  $$('[data-i18n]', raiz).forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]', raiz).forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $$('select[data-f="docTipo"]', raiz).forEach(sel => {
    const v = sel.value || 'CC';
    sel.innerHTML = DOC_CODES.map(c => `<option value="${c}">${esc(t('doc.' + c))}</option>`).join('');
    sel.value = v;
  });
}
function cambiarIdioma(nuevo){
  if (!IDIOMAS.includes(nuevo)) return;
  lang = nuevo;
  try { localStorage.setItem('idioma', nuevo); } catch (e) {}
  document.documentElement.lang = nuevo;
  $$('.lang-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === nuevo));
  document.title = t('docTitle');
  $('#pie').textContent = CONFIG.resguardo + ' · ' + CONFIG.territorio;
  aplicarIdioma();
  renumerar();
  ['#msg', '#msgEnv'].forEach(ocultarMsg);
  $('#btnGenerar').textContent = t('btn.enviar');
  if (vista === 'env' && ultimo) mostrarEnviado();
  else if (vista === 'verif') mostrarVerificacion(parametroVerif);
  else $('#titulo').textContent = t('title.reg');
}

/* ============================================================
   INICIO
   ============================================================ */
function init(){
  DB.iniciar();
  lang = idiomaInicial();
  document.documentElement.lang = lang;
  $('#org').textContent = CONFIG.organizacion + ' · NIT ' + CONFIG.nit;
  $('#pie').textContent = CONFIG.resguardo + ' · ' + CONFIG.territorio;
  $('#fechaIngreso').value = hoyISO();
  $$('.lang-btn').forEach(b => b.addEventListener('click', () => cambiarIdioma(b.dataset.lang)));
  $('#btnIndividual').onclick = () => setTipo('individual');
  $('#btnGrupo').onclick = () => setTipo('grupo');
  $('#btnAgregar').onclick = () => { agregarPersona(); };
  $('#btnGenerar').onclick = enviar;
  $('#btnCopia').onclick = descargarCopia;
  $('#btnRespaldo').onclick = respaldo;
  $('#btnNuevo').onclick = () => { location.replace(location.href.split(/[?#]/)[0]); };
  aplicarIdioma();
  setTipo('individual');
  $$('.lang-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#titulo').textContent = t('title.reg');
  document.title = t('docTitle');
  if (location.hash.startsWith('#v=')) mostrarVerificacion(decodeURIComponent(location.hash.slice(3)));
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('hashchange', () => location.reload());
</script>
